services:
  mongodb:
    image: mongo:7.0
    container_name: agriagent-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: agriagent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=agriagent_db
      - DEBUG=true
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
